name: CI

on:
  push:
    branches-ignore: [gh-pages]

permissions:
  contents: write

env:
  GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.3-stable
  GODOT: ${{ github.workspace }}/.godot-bin/Godot_v4.3-stable_linux.x86_64

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            .godot-bin
            ~/.local/share/godot/export_templates/4.3.stable
          key: godot-4.3-stable-web-nothreads

      - name: Download Godot and web export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p .godot-bin
          curl -fsSL -o "$tmp/godot.zip" "$GODOT_URL/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q "$tmp/godot.zip" -d .godot-bin
          chmod +x "$GODOT"
          curl -fsSL -o "$tmp/templates.tpz" "$GODOT_URL/Godot_v4.3-stable_export_templates.tpz"
          mkdir -p "$tmp/t" ~/.local/share/godot/export_templates/4.3.stable
          unzip -q "$tmp/templates.tpz" templates/web_nothreads_release.zip templates/version.txt -d "$tmp/t"
          cp "$tmp/t/templates/web_nothreads_release.zip" "$tmp/t/templates/version.txt" \
            ~/.local/share/godot/export_templates/4.3.stable/

      - name: Headless tests
        run: tests/run.sh

      - name: Export Web
        run: |
          mkdir -p build/web
          "$GODOT" --headless --path . --export-release Web build/web/index.html
          test -f build/web/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web
      - name: Deploy to gh-pages
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/deploy_pages.sh "$BRANCH" build/web
