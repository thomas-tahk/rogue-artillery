<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Pick a Look</title>
<style>:root{--bg:#14121a;--fg:#ece8f4;--mut:#a59fb5;--card:#1f1c28}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:1100px;margin:auto;padding:24px 16px 64px}h1{margin:0 0 4px}p.lead{color:var(--mut);margin:0 0 24px}
figure{margin:0 0 28px;background:var(--card);border-radius:12px;overflow:hidden}img{display:block;width:100%;height:auto}
figcaption{padding:12px 16px;display:flex;flex-direction:column;gap:2px}figcaption span{color:var(--mut)}b{font-size:1.15rem}</style></head>
<body><main><h1>Rogue Artillery: pick a look</h1>
<p class="lead">Same battle moment drawn five ways. Art is stand-in (made in code); what matters is the style. Click a picture for full size. Reply on the GitHub issue with a letter, or mix ("B tanks + E sky").</p>
<figure><a href="atmospheric-silhouette.png"><img src="atmospheric-silhouette.png" alt="Look A: Silhouette" loading="lazy"></a>
<figcaption><b>A · Silhouette</b><span>Sunset sky, dark rim-lit shapes. Moody, minimal, lets light and effects carry it.</span></figcaption></figure><figure><a href="vector-cartoon.png"><img src="vector-cartoon.png" alt="Look B: Cartoon" loading="lazy"></a>
<figcaption><b>B · Cartoon</b><span>Bright colours, thick outlines, chunky toy-like tanks. Friendly and very readable.</span></figcaption></figure><figure><a href="papercraft.png"><img src="papercraft.png" alt="Look C: Papercraft" loading="lazy"></a>
<figcaption><b>C · Papercraft</b><span>Cut-paper layers, tape-strip HUD, confetti blasts. Handmade, playful.</span></figcaption></figure><figure><a href="neon-vector.png"><img src="neon-vector.png" alt="Look D: Neon" loading="lazy"></a>
<figcaption><b>D · Neon</b><span>Glowing lines on a dark field. Sleek, arcade-modern, big flashy explosions.</span></figcaption></figure><figure><a href="hibit-pixel.png"><img src="hibit-pixel.png" alt="Look E: Hi-bit pixel" loading="lazy"></a>
<figcaption><b>E · Hi-bit pixel</b><span>Detailed modern pixel art with dithered sunset sky. Crafted, not 90s-cheap.</span></figcaption></figure></main></body></html>
